<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get In Touch | Avinash Dutta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <section class="contact-section">
        <div class="container">
            <h2 class="section-title">Get In Touch</h2>
            <div class="contact-grid">
                
                <div class="contact-info">
                    <h3>Contact Details</h3>
                    <p><i class="fas fa-envelope"></i> avinashdutta9719@gmail.com</p>
                    <p><i class="fas fa-phone"></i> +977 9829099719</p>
                    <p><i class="fas fa-map-marker-alt"></i> 28-Kilo, Dhulikhel, Nepal</p>
                </div>

                <div class="contact-form-container">
                    <!-- Secure submission endpoint -->
                    <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
                        
                        <!-- Create a free key at web3forms.com and paste it here -->
                        <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY_HERE">
                        
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="name" required placeholder="Your Name">
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" required placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea name="message" rows="5" required placeholder="Type your message here..."></textarea>
                        </div>
                        
                        <button type="submit" class="btn submit-btn" id="submit-btn">Send Message</button>
                    </form>
                    <div id="form-status" class="form-status"></div>
                </div>

            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
